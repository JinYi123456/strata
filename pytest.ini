[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ``slow`` marks tests that load the feature models and run the full pipeline
# over a real frame pair. They take tens of seconds each, so they are excluded
# by default and run explicitly with ``pytest -m slow``. Everything else is
# pure arithmetic and runs in a couple of seconds.
markers =
    slow: end-to-end tests that run the full pipeline (deselected by default)

addopts =
    -ra
    --strict-markers
    -m "not slow"
