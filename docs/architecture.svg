<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>STRATA architecture</title>
  <desc>Layered architecture: an operator console talks to a single-origin HTTP API, which drives an agent loop over an OpenCV 5 vision core, persisting through one storage interface with a local and a managed backend. The managed path runs on AWS Graviton, with a reproducible COOL benchmark alongside it.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A8F87" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1240" height="780" fill="#FFFFFF"/>

  <!-- A. console -->
  <rect x="40" y="36" width="1160" height="76" rx="10" fill="#F6F7F5" stroke="#C9CCC4" stroke-width="1"/>
  <text x="60" y="66" font-size="15" font-weight="600" fill="#1F2421">Operator console</text>
  <text x="60" y="90" font-size="12.5" fill="#5F5E5A">capture  ·  aligned compare  ·  change set  ·  coverage and guidance  ·  approval gate  ·  site ledger</text>
  <text x="1180" y="66" font-size="11.5" text-anchor="end" fill="#8A8F87">TypeScript · Next.js · static export</text>

  <path d="M620 112 L620 146" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- B. api -->
  <rect x="40" y="148" width="1160" height="68" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
  <text x="60" y="178" font-size="15" font-weight="600" fill="#0C447C">HTTP API</text>
  <text x="60" y="199" font-size="12.5" fill="#185FA5">sessions  ·  scans  ·  panels  ·  guidance  ·  ledger  —  one origin, one artefact, typed contract</text>
  <text x="1180" y="178" font-size="11.5" text-anchor="end" fill="#185FA5">Python · FastAPI</text>

  <path d="M620 216 L620 250" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- C. agent -->
  <rect x="40" y="252" width="1160" height="76" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text x="60" y="282" font-size="15" font-weight="600" fill="#3C3489">Agent loop</text>
  <text x="60" y="306" font-size="12.5" fill="#534AB7">observe  →  decide  →  act  →  human gate  →  finish,  with a step-by-step trace of who decided what, and why</text>
  <rect x="900" y="266" width="140" height="30" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1"/>
  <text x="970" y="286" font-size="11.5" text-anchor="middle" fill="#3C3489">deterministic policy</text>
  <rect x="1050" y="266" width="132" height="30" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="1"/>
  <text x="1116" y="286" font-size="11.5" text-anchor="middle" fill="#3C3489">model, optional</text>

  <path d="M620 328 L620 362" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- D. vision core -->
  <rect x="40" y="364" width="1160" height="126" rx="12" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="60" y="390" font-size="15" font-weight="600" fill="#085041">Vision core</text>
  <text x="1180" y="390" font-size="11.5" text-anchor="end" fill="#0F6E56">OpenCV 5  ·  pure functions, arrays in and out</text>

  <rect x="40" y="400" width="216" height="66" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="148" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">Features</text>
  <text x="148" y="445" font-size="11.5" text-anchor="middle" fill="#0F6E56">ALIKED · LightGlue</text>
  <text x="148" y="460" font-size="11" text-anchor="middle" fill="#8A8F87">SIFT fallback</text>

  <rect x="276" y="400" width="216" height="66" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="384" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">Geometry</text>
  <text x="384" y="445" font-size="11.5" text-anchor="middle" fill="#0F6E56">USAC / MAGSAC</text>
  <text x="384" y="460" font-size="11" text-anchor="middle" fill="#8A8F87">H and F models</text>

  <rect x="512" y="400" width="216" height="66" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="620" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">Change diff</text>
  <text x="620" y="445" font-size="11.5" text-anchor="middle" fill="#0F6E56">luminance + chroma</text>
  <text x="620" y="460" font-size="11" text-anchor="middle" fill="#8A8F87">per-pair calibration</text>

  <rect x="748" y="400" width="216" height="66" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="856" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">Event resolution</text>
  <text x="856" y="445" font-size="11.5" text-anchor="middle" fill="#0F6E56">typed and scored</text>
  <text x="856" y="460" font-size="11" text-anchor="middle" fill="#8A8F87">moved vs removed+new</text>

  <rect x="984" y="400" width="216" height="66" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="1092" y="424" font-size="13" font-weight="600" text-anchor="middle" fill="#085041">Coverage</text>
  <text x="1092" y="445" font-size="11.5" text-anchor="middle" fill="#0F6E56">what was not seen</text>
  <text x="1092" y="460" font-size="11" text-anchor="middle" fill="#8A8F87">drives the next capture</text>

  <path d="M256 433 L272 433" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M492 433 L508 433" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M728 433 L744 433" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M964 433 L980 433" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <path d="M620 490 L620 522" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- E. store -->
  <rect x="40" y="524" width="1160" height="64" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="60" y="552" font-size="15" font-weight="600" fill="#633806">Store</text>
  <text x="60" y="573" font-size="12.5" fill="#854F0B">one interface, two backends — switching is a configuration change, not a code change</text>
  <rect x="880" y="538" width="140" height="34" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="950" y="559" font-size="11.5" text-anchor="middle" fill="#633806">local disk</text>
  <rect x="1032" y="538" width="148" height="34" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="1106" y="559" font-size="11.5" text-anchor="middle" fill="#633806">S3 + DynamoDB</text>

  <path d="M620 588 L620 618" stroke="#8A8F87" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- F. aws -->
  <rect x="40" y="620" width="1160" height="120" rx="12" fill="#F6F7F5" stroke="#C9CCC4" stroke-width="1"/>
  <text x="60" y="646" font-size="15" font-weight="600" fill="#1F2421">AWS  ·  Graviton arm64</text>
  <text x="1180" y="646" font-size="11.5" text-anchor="end" fill="#8A8F87">hybrid: x86 for the console, Arm for the vision workload</text>

  <rect x="40" y="662" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1"/>
  <text x="148" y="685" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1F2421">Lambda arm64</text>
  <text x="148" y="704" font-size="11" text-anchor="middle" fill="#5F5E5A">runs the vision core</text>

  <rect x="276" y="662" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1"/>
  <text x="384" y="685" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1F2421">S3</text>
  <text x="384" y="704" font-size="11" text-anchor="middle" fill="#5F5E5A">sessions, panels, artefacts</text>

  <rect x="512" y="662" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1"/>
  <text x="620" y="685" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1F2421">DynamoDB</text>
  <text x="620" y="704" font-size="11" text-anchor="middle" fill="#5F5E5A">append-only ledger</text>

  <rect x="748" y="662" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1"/>
  <text x="856" y="685" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1F2421">CloudWatch</text>
  <text x="856" y="704" font-size="11" text-anchor="middle" fill="#5F5E5A">logs, metrics, timings</text>

  <rect x="984" y="662" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#C9CCC4" stroke-width="1"/>
  <text x="1092" y="685" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1F2421">EC2 Graviton4 · COOL</text>
  <text x="1092" y="704" font-size="11" text-anchor="middle" fill="#5F5E5A">reproducible benchmark</text>

  <text x="40" y="766" font-size="11" fill="#8A8F87">The vision core is a pure function of its inputs: the same code runs in the console, in the service and in the Arm container.</text>
</svg>
